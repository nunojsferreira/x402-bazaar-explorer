name: Daily snapshot

on:
  schedule:
    # 06:17 UTC. Off the hour so we are not competing with everyone else's cron.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "**.md"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      listings: ${{ steps.summary.outputs.listings }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch, transform and build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - name: Smoke test the built site
        run: npm test

      - name: Summarise the snapshot
        id: summary
        run: |
          node -e '
            const m = require("./dist/data/meta.json");
            const line = (k, v) => `| ${k} | ${v} |`;
            const rows = [
              line("Listings", m.listings.toLocaleString("en-US")),
              line("Providers", m.providers.toLocaleString("en-US")),
              line("Median price", "$" + m.priceMedian),
              line("30d calls", m.calls30d.toLocaleString("en-US")),
              line("30d unique payers", m.payers30d.toLocaleString("en-US")),
              line("Listings with 10+ calls", m.active10.toLocaleString("en-US")),
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## x402 Bazaar snapshot ${m.day}\n\n| Metric | Value |\n| --- | --- |\n${rows}\n`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `listings=${m.listings}\n`);
          '

      - name: Commit the history point
        run: |
          if git diff --quiet -- data/history; then
            echo "history unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -m "chore(data): snapshot $(node -p "require('./dist/data/meta.json').day")"
          # A manual run can overlap the cron or a push, so the ref may have
          # moved under us. Rebase and retry rather than failing the deploy.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt), rebasing on origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push the history point after 3 attempts"
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
